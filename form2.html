<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>all input types form</title>
</head>
<body>
    <h2>form with all input types</h2>
    <formaction="/submit" method="post">
        <label for="text">text</label>
        <input type="text" id="text"><br><br>

     <!-- Password -->
     <label for="password">Password :</label>
    <input type="password" id="password" name="password"><br><br>

<!-- Email -->
<label for="email">Email :</label>
<input type="email" id="email" name="email"><br><br>

<!-- Number -->
<label for="number">Number :</label>
<input type="number" id="number" name="number"><br><br>

<!-- Date-->
<label for="date">Date :</label>
<input type="date" id="date" name="date"><br><br>

<!--Time -->
<label for="time">Time :</label>
<input type="time" id="time" name="time"><br><br>

<!--Checkbox -->
<label>Checkbox :</label>
<input type="checkbox" id="check1" name="check1" value="yes"> Option
1<br><br>

<!-- Radio -->
<label>Radio :</label>
<input type="radio" id="radio1" name="radio" value="option1"> Option 1
<input type="radio" id="radio2" name="radio" value="option2"> Option
2<br><br>

<!-- Color Picker -->
<label for="color">Color :</label>
<input type="color" id="color" name="color"><br><br>

<!-- File Upload -->
<label for="file">File :</label>
<input type="file" id="file" name="file"><br><br>

<!-- Range Slider -->
<label for="range">Range :</label>
<input type="range" id="range" name="range" min="0" max="100"><br><br>

<!-- Tel -->
<label for="tel">Phone :</label>
<input type="tel" id="tel" name="tel"><br><br>

<!-- URL -->
<label for="url">Website :</label>
<input type="url" id="url" name="url"><br><br>

<!-- Hidden -->
<input type="hidden" name="userld" value="12345">

<!-- Submit & Reset -->
<input type="submit" value="Submit">
<input type="reset" value="Reset">

</form>

</body>
</html>
